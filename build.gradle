// Do not package disposable regression fixtures or temporary synchronization files.
tasks.named('jar') { exclude 'br/mareeletrica/ArmoryIntegration*'; exclude '**/.rsync-tmp/**' }
tasks.named('processResources') { doNotTrackState('Temporary synchronization files can disappear during development.'); exclude '**/.rsync-tmp/**' }

// 0.53 visual check: scene + screenshots (test only, never in the release JAR).
if (project.hasProperty('visual053')) {
 tasks.named('compileJava') { options.incremental = false }
 sourceSets.main.java.srcDir('tests/visual053')
 neoForge.runs.client {
  gameDirectory = file('run-visual')
  jvmArguments.addAll('-Xmx4G','-XX:+UseSerialGC')
  systemProperty 'mareeletrica.cockpit', project.hasProperty('cockpit').toString()
