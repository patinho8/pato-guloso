plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}
version = '0.67.4'
group = 'br.mareeletrica'
base { archivesName = 'mare-eletrica' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
neoForge {
    version = providers.gradleProperty('testNeoForgeVersion').getOrElse('21.1.172')
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        mareeletrica { sourceSet sourceSets.main }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

if (project.hasProperty('update0210Integration')) {
 tasks.named('compileJava') { options.incremental = false }
 sourceSets.main.java.srcDir('tests/update0210')
 neoForge.runs.client {
  gameDirectory = file('run-armory21')
  systemProperty 'mareeletrica.update21Test', 'true'
  systemProperty 'mareeletrica.quickArmory', project.hasProperty('quickArmory').toString()
  programArguments.addAll('--width','1280','--height','720','--username','ArmoryTest')
 }
}

// Disposable graphical regression world; never part of the release JAR.
if (project.hasProperty('remoteClientIntegration')) {
    tasks.named('compileJava') { options.incremental = false }
    sourceSets.main.java.srcDir('tests/client_integration')
    neoForge.runs {
        client {
            gameDirectory = file('run-camera-test')
            systemProperty 'mareeletrica.cameraTest', 'true'
            programArguments.addAll('--width', '960', '--height', '540', '--username', 'CameraTest')
        }
    }
}

if (project.hasProperty('testRendererJar')) {
 dependencies { runtimeOnly files(project.property('testRendererJar')) }
}

